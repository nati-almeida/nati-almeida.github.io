name: ola mundo cruel # NOME DA ACTION
 
#GATILHO, QUANDO A ACTION VAI RODAR
on:
  push:
    branches: ['main']
 
#CRIA AS TAREFAS QUE DEVEM SER EXECUTADAS
jobs:
  saudacao: #NOME DA TAREFA
    runs-on: ubuntu-latest # ONDE DEVE SER EXECUTADO
    steps: #ETAPAS
      - name: primeiro contato
        run: echo "ola mundo cruel"
      - name: resposta
        run: "a exinção esta chegando "
      - name: verificar se eh humano
        run: echo "qual a resposta de 2+2"
      - name: resposta captcha
        run: echo "$((2+2))"
  adeus:
    runs-on: ubuntu-latest
    steps:
      - name: o fim
        run: echo "apos uma tempestade solar, a humanidade virou churrasquinho"
      - name: nova era
        run: echo "uma nova raça animal começa a dominar o planeta"
 

