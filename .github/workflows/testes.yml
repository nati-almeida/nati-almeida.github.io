name: Testes automatizados

on:
  pull_request:
  type: [opened, synchronize, reopened]

jobs:
  jeste:
    namoe: jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: configurar o nomejs
        uses: actions/setup@v4
        with:
          node-version: 24
          cache: npm
      - name: instalar dependencias
        run: npm ci

      - name: rodar testes
        run: npx jest --ci  
            
